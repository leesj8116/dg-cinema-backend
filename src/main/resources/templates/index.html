<!DOCTYPE html>
<html lang="ko"
      xmlns="http://www.w3.org/1999/html"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DG-Cinema</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}">
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/index.js}"></script>
</head>
<body>
<header>
    <form id="login-area">
        <p>
            <label for="account-field">계정 : </label>
            <input id="account-field" type="email" required/>
            <label for="password-field">비밀번호 : </label>
            <input id="password-field" type="password" required/>
        </p>
        <p>
            <button type="button" onclick="loginEvent()">로그인</button>
        </p>
    </form>
    <div id="login-info-area">
        <p>
            <span id="user-name"></span>
            <span>님 환영합니다</span>
            <button type="button" onclick="logout()">로그아웃</button>
        </p>
    </div>
    <nav>
        <ul class="nav-list">
            <li id="nav-main" class="selected" onclick="changePage(0)">예약 하기</li>
            <li id="nav-my-reservation" onclick="changePage(1)">예약 확인</li>
        </ul>
    </nav>
</header>
<main>
    <div id="tab-main">
        <h2>영화별 검색</h2>
        <div>
            <table id="movie-list">
                <caption>영화 목록</caption>
                <colgroup>
                    <col style="width: 55%"/>
                    <col style="width: 20%"/>
                    <col style="width: 15%"/>
                    <col style="width: 10%"/>
                </colgroup>
                <tr>
                    <th>제목</th>
                    <th>감독</th>
                    <th>개봉일자</th>
                    <th>비고</th>
                </tr>
                <tr class="movie">
                </tr>
            </table>
        </div>
        <hr/>
        <h3>상영시간표</h3>
        <div>
            <div id="running-time-seacrh-by-movie">
                <p>
                    <label for="search-movie-title">영화 제목 : </label>
                    <input id="search-movie-title" type="text"/>
                    <button id="search-movie-title-btn" type="button" onclick="searchRunningTimeByMovieTitleApi()">검색
                    </button>
                </p>
            </div>
            <div id="running-time-list-by-movie">
                <table>
                    <caption>검색 결과</caption>
                    <thead>
                    <tr>
                        <th>제목</th>
                        <th>극장</th>
                        <th>상영관</th>
                        <th>상영일</th>
                        <th>상영시간</th>
                        <th>비고</th>
                    </tr>
                    </thead>
                    <tbody id="running-time-body">
                    <tr class="running-time"></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <h2>예매하기</h2>
        <h3>좌석 현황</h3>
        <div>
            <table id="reservation-seat-info">
                <thead>
                <tr>
                    <td colspan="12">Screen</td>
                </tr>
                </thead>
                <tbody id="reservation-seat-info-body">
                </tbody>
            </table>
        </div>
        <div id="reservation-task">
            <h3>선택 내용 </h3>
            <input id="reservation-running-time-id" type="hidden" hidden="hidden"/>
            <p>
                <span>영화 제목 : </span>
                <span id="reservation-task-what"></span>
            </p>
            <p>
                <span>상영 시간 : </span>
                <span id="reservation-task-when"></span>
            </p>
            <p>
                <span>극장 : </span>
                <span id="reservation-task-where-cinema"></span>
            </p>
            <p>
                <span>상영관 : </span>
                <span id="reservation-task-where-screen"></span>
            </p>
            <p>
                <label for="seat-no">선택 좌석 : </label>
                <input id="seat-no" type="text" pattern="^[A-H][0-9]{1,2}$" disabled/>
            </p>
            <p>
                <button id="regist-reservation-btn" type="button" onclick="makeReservation()">예약</button>
            </p>
        </div>
    </div>
    <div id="tab-my-reservation">
        <h2>예약 확인</h2>
        <div>
            <table id="my-reservation-table">
                <caption>영화 목록</caption>
                <colgroup>
                    <col style="width: 10%"/>
                    <col style="width: 10%"/>
                    <col style="width: 20%"/>
                    <col style="width: 15%"/>
                    <col style="width: 25%"/>
                    <col style="width: 10%"/>
                    <col style="width: 10%"/>
                </colgroup>
                <tr>
                    <th>극장</th>
                    <th>상영관</th>
                    <th>상영일</th>
                    <th>상영시간</th>
                    <th>제목</th>
                    <th>예약 좌석</th>
                    <th>결제 상태</th>
                </tr>
                <tr class="reservation-list">
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
